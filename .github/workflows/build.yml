name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build app bundle
        run: bash build-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: kbswitch.app
          path: .build/kbswitch.app

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build app bundle
        run: bash build-app.sh

      - name: Create DMG
        run: |
          mkdir -p .build/dmg
          cp -a .build/kbswitch.app .build/dmg/
          ln -s /Applications .build/dmg/Applications
          hdiutil create -volname kbswitch -srcfolder .build/dmg \
            -ov -format UDZO .build/kbswitch.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: .build/kbswitch.dmg
